name: Self Hosted Runner Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: self-hosted

    steps:
      - name: Check runner
        run: |
          echo "Hello from self-hosted runner"
          hostname
          whoami
          pwd

      - name: Check Docker
        run: docker --version

      - name: Check Java
        run: java -version

      - name: Check Maven
        run: mvn -version

